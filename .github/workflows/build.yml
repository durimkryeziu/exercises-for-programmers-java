name: Build with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Run PMD Analysis
      run: ./gradlew pmdMain pmdTest --console=plain
      continue-on-error: false # Fail if code quality issues are found

    - name: Run Checkstyle Analysis
      run: ./gradlew checkstyleMain checkstyleTest --console=plain
      continue-on-error: false # Fail if code style issues are found

    - name: Run Unit Tests
      run: ./gradlew test --console=plain

    - name: Build Project
      run: ./gradlew build --console=plain

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
